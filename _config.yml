title: Interview Preparation Guide
description: Comprehensive guide to cracking technical interviews at FAANG, top startups, and MNCs
theme: just-the-docs

source: docs

url: https://shubhu-io.github.io
baseurl: /interview-preparation-guide

color_scheme: dark

# Mermaid diagrams (flowcharts in index pages)
mermaid:
  version: "10.9.1"

aux_links:
  "GitHub":
    - "https://github.com/shubhu-io/interview-preparation-guide"
  "Wiki":
    - "https://github.com/shubhu-io/interview-preparation-guide/wiki"

aux_links_new_tab: true

nav_sort: case_insensitive
nav_enabled: true

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Comprehensive interview preparation resource. Contributed by the community.
  <a href="https://github.com/shubhu-io/interview-preparation-guide">View on GitHub</a>

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/shubhu-io/interview-preparation-guide"
gh_edit_branch: "master"
gh_edit_source: docs
gh_edit_view_mode: "edit"

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  button: true
  focus_shortcut_key: "k"

enable_copy_code_button: true

callouts:
  warning:
    title: Warning
    color: yellow
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  danger:
    title: Danger
    color: red
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache

exclude:
  - node_modules/
  - .git/
  - README.md
  - _site/
  - .github/
